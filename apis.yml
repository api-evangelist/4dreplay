aid: 4dreplay
name: 4DReplay
description: '4DReplay is a media technology company that builds multi-camera, time-slice
  ("bullet-time") video capture and replay systems for live sports, entertainment and
  events. Arrays of roughly 50 to 120 synchronized cameras — locked to within 1/10,000
  of a second — are processed in real time to produce any-angle replay highlights within
  seconds of a play and deliver them to broadcast, mobile and OTT audiences. The product
  line spans 4DReplay (premium broadcast instant replay), 4DReplay+ / 4DLive (5G-based
  interactive multi-view live streaming with speed, angle and tracking overlays), and
  4Dist, a browser-based interactive OTT platform that adds automated AI motion and
  swing analysis for academies, coaches and players. Founded in 2012 by Hongsu Jung
  and headquartered in San Mateo, California, with offices in Seoul and Tokyo, the
  company has worked with ESPN, NBC, CBS, FOX Sports, the NBA, MLB, NHL, the PGA Championship
  and the Olympics. As of August 2026 4DReplay publishes no public developer API, SDK,
  or machine-readable API contract; its surfaces are broadcast integrations and the
  consumer/operator 4Dist web and mobile apps.'
